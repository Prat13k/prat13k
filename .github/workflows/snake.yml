name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:      # Allows manual trigger
  push:
    branches: [main]

permissions:
  contents: write         # Grants write access to push to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the repository (Crucial for Git operations)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generate the Snake SVG with your custom colors
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF9933&color_dots=#161b22,#7a4a17,#b86d1f,#e8832a,#FF9933

      # 3. Deploy to the output branch
      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
